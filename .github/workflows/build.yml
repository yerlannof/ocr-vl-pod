name: build-image
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: [Dockerfile, patch_lora_targets.py, .github/workflows/build.yml]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # базовый runpod/pytorch толстый — освобождаем диск раннера
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/local/share/powershell
          sudo docker system prune -af || true
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/yerlannof/ocr-vl-pod:v2
            ghcr.io/yerlannof/ocr-vl-pod:latest

      - name: Report size
        run: docker images ghcr.io/yerlannof/ocr-vl-pod || true
